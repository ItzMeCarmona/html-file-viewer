<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Classroom</title>
    <link rel="icon" type="image/png" href="https://www.gstatic.com/classroom/favicon.png" />
    <style>
      :root {
        --bg: #f5f5f5;
        --panel: #ffffff;
        --text: #1f1f1f;
        --button: #1a73e8;
        --button-hover: #1559b6;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
      }

      .starter {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      }

      button {
        border: none;
        border-radius: 10px;
        background: var(--button);
        color: #fff;
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        background: var(--button-hover);
      }

      .hidden {
        display: none;
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="starter" id="starter">
      <h2>Open HTML File</h2>
      <button id="openViewerBtn">Open Viewer</button>
    </div>

    <script>
      const starter = document.getElementById('starter');
      const openViewerBtn = document.getElementById('openViewerBtn');

      openViewerBtn.addEventListener('click', () => {
        const viewer = window.open('about:blank', '_blank');
        if (!viewer) {
          alert('Popup blocked. Please allow popups and try again.');
          return;
        }

        const doc = viewer.document;
        doc.title = 'Google Classroom';
        const favicon = doc.createElement('link');
        favicon.rel = 'icon';
        favicon.type = 'image/png';
        favicon.href = 'https://www.gstatic.com/classroom/favicon.png';
        doc.head.appendChild(favicon);

        doc.body.innerHTML = `
          <style>
            html, body {
              margin: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #fff;
              font-family: Arial, Helvetica, sans-serif;
            }

            .upload-wrap {
              position: fixed;
              inset: 0;
              display: flex;
              align-items: center;
              justify-content: center;
              background: #f5f5f5;
              z-index: 2;
            }

            .upload-box {
              background: white;
              padding: 32px 28px;
              border-radius: 16px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.08);
              text-align: center;
            }

            input[type="file"] {
              display: block;
              margin-top: 14px;
            }

            iframe {
              position: fixed;
              inset: 0;
              width: 100vw;
              height: 100vh;
              border: none;
              background: white;
              z-index: 1;
            }
          </style>

          <div class="upload-wrap" id="uploadWrap">
            <div class="upload-box">
              <h2>Select an HTML file</h2>
              <input id="htmlFileInput" type="file" accept=".html,.htm,text/html" />
            </div>
          </div>
        `;

        let fileLoaded = false;
        const fileInput = doc.getElementById('htmlFileInput');

        fileInput.addEventListener('change', (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;

          const objectUrl = URL.createObjectURL(file);

          const existingIframe = doc.getElementById('previewFrame');
          if (existingIframe) existingIframe.remove();

          const iframe = doc.createElement('iframe');
          iframe.id = 'previewFrame';
          iframe.src = objectUrl;
          iframe.setAttribute('title', 'HTML Preview');
          iframe.style.zIndex = '1';

          const uploadWrap = doc.getElementById('uploadWrap');
          if (uploadWrap) uploadWrap.remove();

          doc.body.appendChild(iframe);
          fileLoaded = true;
        });

        viewer.addEventListener('beforeunload', (event) => {
          if (fileLoaded) {
            event.preventDefault();
            event.returnValue = '';
          }
        });
      });
    </script>
  </body>
</html>
